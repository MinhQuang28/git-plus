name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity for integration tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: ./build-app.sh
